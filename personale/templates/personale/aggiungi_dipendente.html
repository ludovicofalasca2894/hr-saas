<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aggiungi Dipendente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar { background-color: #212529; }
        .card { border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-top: 30px; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">HR SaaS</a>
            <div class="d-flex">
                <a href="/" class="btn btn-outline-light btn-sm me-2">Dashboard</a>
                <a href="/admin/logout/" class="btn btn-danger btn-sm">Esci</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-white">
                        <h4 class="mb-0">Aggiungi un nuovo dipendente</h4>
                    </div>
                    <div class="card-body">
                        <form method="POST">
                            {% csrf_token %}
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Nome</label>
                                    <input type="text" name="nome" class="form-control" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Cognome</label>
                                    <input type="text" name="cognome" class="form-control" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" name="email" class="form-control" required>
                            </div>
                            <div class="row">
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Data Assunzione</label>
                                    <input type="date" name="data_assunzione" class="form-control" required>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Ruolo</label>
                                    <input type="text" name="ruolo" class="form-control" value="Dipendente" required>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Ferie Residue (giorni)</label>
                                    <input type="number" step="0.01" name="ferie_residue" class="form-control" value="20.00" required>
                                </div>
                            </div>
                            <div class="d-flex justify-content-between mt-3">
                                <a href="/" class="btn btn-secondary">Annulla</a>
                                <button type="submit" class="btn btn-primary">Salva Dipendente</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
